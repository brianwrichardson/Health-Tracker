<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Nutrition Tracker</title>
    <style>
        /* CSS: Styling the App */
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 { color: var(--dark); text-align: center; }

        .input-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-weight: bold; }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { opacity: 0.9; }

        .history {
            margin-top: 30px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 14px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th { background-color: var(--dark); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Health Tracker</h2>
    
    <div class="input-group">
        <label>Calories</label>
        <input type="number" id="calories" placeholder="e.g. 2000">
    </div>
    <div class="input-group">
        <label>Water (Liters)</label>
        <input type="number" step="0.1" id="water" placeholder="e.g. 2.5">
    </div>
    <div class="input-group">
        <label>Journal Note</label>
        <textarea id="note" rows="3" placeholder="How do you feel?"></textarea>
    </div>
    <button onclick="saveEntry()">Save Entry</button>

    <div class="history">
        <h3>Recent Records</h3>
        <table id="recordTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Cal</th>
                    <th>Water</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // JavaScript: Logic and Data Handling

    // 1. Load data when app starts
    window.onload = function() {
        displayRecords();
    };

    function saveEntry() {
        const calories = document.getElementById('calories').value;
        const water = document.getElementById('water').value;
        const note = document.getElementById('note').value;
        const date = new Date().toLocaleDateString();

        if(!calories || !water) {
            alert("Please enter calories and water!");
            return;
        }

        // Create an entry object
        const entry = { date, calories, water, note };

        // 2. Get existing data from LocalStorage or start empty array
        let history = JSON.parse(localStorage.getItem('healthData')) || [];

        // 3. Add new entry to the start of the list
        history.unshift(entry);

        // 4. Save back to LocalStorage
        localStorage.setItem('healthData', JSON.stringify(history));

        // 5. Clear inputs and refresh table
      document.getElementById('calories').value = '';
      document.getElementById('Protein').value = '';
      document.getElementById('Carbohydrate').value = '';
      document.getElementById('Fat').value = '';
      document.getElementById('water').value = '';
      document.getElementById('note').value = '';
      displayRecords();
    }

    function displayRecords() {
        const history = JSON.parse(localStorage.getItem('healthData')) || [];
        const tableBody = document.getElementById('tableBody');
        
        tableBody.innerHTML = ''; // Clear current table

        history.forEach(item => {
            const row = `<tr>
                <td>${item.date}</td>
                <td>${item.calories}</td>
                <td>${item.water}L</td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }
</script>

</body>
</html>
